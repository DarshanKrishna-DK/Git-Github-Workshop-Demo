# ────────────────────────────────────────────────────────────
# Auto-Merge Workflow for Workshop Contributors Board
# ────────────────────────────────────────────────────────────
# This workflow runs whenever a pull request is opened or updated.
# It validates that the PR:
#   1. Only adds a single JSON file inside contributors/
#   2. Does NOT modify index.html, styles.css, or script.js
#   3. The JSON file contains all required fields
# If validation passes, it auto-approves and auto-merges the PR.
#
# NOTE: We use pull_request_target so the workflow runs automatically
# for fork PRs without requiring maintainer approval each time.
# This is safe because we never execute code from the PR — we only
# read file names and parse JSON.
# ────────────────────────────────────────────────────────────

name: Auto Merge Contributor PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout the base repository ──────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Get the list of changed files ─────────
      - name: Get changed files
        id: changed
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: Validate the changed files ────────────
      - name: Validate PR changes
        id: validate
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          VALID=true
          ERROR=""

          FILE_COUNT=$(echo "$FILES" | grep -c '[^[:space:]]' || true)
          echo "Total files changed: $FILE_COUNT"

          # Rule 1: Only one file should be changed
          if [ "$FILE_COUNT" -ne 1 ]; then
            VALID=false
            ERROR="PR must add exactly one file. Found $FILE_COUNT changed files."
          fi

          # Rule 2: The file must be a .json inside contributors/ (not index.json)
          CONTRIB_JSON=$(echo "$FILES" | grep -c '^contributors/.*\.json$' || true)
          IS_INDEX=$(echo "$FILES" | grep -c '^contributors/index\.json$' || true)
          if [ "$CONTRIB_JSON" -ne 1 ] || [ "$IS_INDEX" -eq 1 ]; then
            VALID=false
            ERROR="$ERROR The changed file must be a .json file inside the contributors/ folder (not index.json)."
          fi

          # Rule 3: No modifications to protected files
          PROTECTED=$(echo "$FILES" | grep -E '^(index\.html|styles\.css|script\.js)$' || true)
          if [ -n "$PROTECTED" ]; then
            VALID=false
            ERROR="$ERROR Protected files were modified: $PROTECTED"
          fi

          echo "valid=$VALID" >> $GITHUB_OUTPUT
          echo "error=$ERROR" >> $GITHUB_OUTPUT

      # ── Step 4: Validate JSON content ─────────────────
      - name: Validate JSON content
        if: steps.validate.outputs.valid == 'true'
        id: json_check
        run: |
          FILE=$(echo "${{ steps.changed.outputs.files }}" | grep '^contributors/.*\.json$')
          echo "Validating: $FILE"

          # Download the raw file directly from the PR branch
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          RAW_URL="https://raw.githubusercontent.com/${REPO}/${PR_SHA}/${FILE}"

          echo "Fetching from: $RAW_URL"
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/pr_file.json "$RAW_URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "json_valid=false" >> $GITHUB_OUTPUT
            echo "json_error=FAIL:Could not fetch file (HTTP $HTTP_CODE)" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "File content:"
          cat /tmp/pr_file.json

          RESULT=$(node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('/tmp/pr_file.json', 'utf8'));
              const required = ['name', 'year', 'branch', 'favoriteTech', 'github'];
              const missing = required.filter(f => !data[f] || typeof data[f] !== 'string' || data[f].trim() === '');
              if (missing.length > 0) {
                console.log('FAIL:Missing fields: ' + missing.join(', '));
              } else {
                console.log('PASS');
              }
            } catch (e) {
              console.log('FAIL:Invalid JSON — ' + e.message);
            }
          ")

          echo "Validation result: $RESULT"

          if [[ "$RESULT" == PASS ]]; then
            echo "json_valid=true" >> $GITHUB_OUTPUT
          else
            echo "json_valid=false" >> $GITHUB_OUTPUT
            echo "json_error=$RESULT" >> $GITHUB_OUTPUT
          fi

      # ── Step 5: Post a comment if validation fails ────
      - name: Comment on failure
        if: steps.validate.outputs.valid != 'true' || steps.json_check.outputs.json_valid == 'false'
        run: |
          BODY="### Validation Failed\n\n"

          if [ "${{ steps.validate.outputs.valid }}" != "true" ]; then
            BODY="${BODY}**File check:** ${{ steps.validate.outputs.error }}\n\n"
          fi

          if [ "${{ steps.json_check.outputs.json_valid }}" == "false" ]; then
            BODY="${BODY}**JSON check:** ${{ steps.json_check.outputs.json_error }}\n\n"
          fi

          BODY="${BODY}Please fix the issues and push again."

          gh pr comment ${{ github.event.pull_request.number }} --body "$(echo -e "$BODY")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 6: Approve the PR ────────────────────────
      - name: Approve PR
        if: steps.validate.outputs.valid == 'true' && steps.json_check.outputs.json_valid == 'true'
        continue-on-error: true
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Looks good! Auto-approved by the workshop bot."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 7: Merge the PR ──────────────────────────
      - name: Merge PR
        if: steps.validate.outputs.valid == 'true' && steps.json_check.outputs.json_valid == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
